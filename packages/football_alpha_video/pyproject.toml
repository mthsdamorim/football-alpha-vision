[project]
name = "football-alpha-video"
version = "0.1.0"
description = "Timestamp-correct video ingestion for football-alpha."
requires-python = ">=3.13"
dependencies = [
    "av>=18.1.0,<19.0.0",
    "numpy>=2.3.0",
]

[project.scripts]
football-alpha-video = "football_alpha_video.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
